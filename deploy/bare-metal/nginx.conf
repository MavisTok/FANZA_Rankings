# 裸机/VPS 部署用 nginx 站点配置示例
# 安装路径默认：/var/www/ranking-site
# 使用方法：
#   sudo cp deploy/bare-metal/nginx.conf /etc/nginx/conf.d/fanza-rankings.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/ranking-site/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /data/ {
        alias /var/www/ranking-site/data/;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        autoindex off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
